<script>
(function () {
  if (window.__sgfCmplzListener) return;
  window.__sgfCmplzListener = true;

  var timer;
  function changed() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'sgf_cmplz_change' });
    }, 300);
  }

  ['cmplz_fire_categories', 'cmplz_status_change', 'cmplz_revoke', 'cmplz_enable_category'].forEach(function (e) {
    document.addEventListener(e, changed);
  });
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('.cmplz-cookiebanner, .cmplz-manage-consent-container, #cmplz-manage-consent, .cmplz-btn')) changed();
  }, true);
})();
</script>
